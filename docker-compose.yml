# Local development database. Data persists in the named volume.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ateanne
      POSTGRES_PASSWORD: ateanne
      POSTGRES_DB: ateanne_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ateanne -d ateanne_dev"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
